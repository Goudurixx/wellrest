name: Release

# Push a tag like v1.5.0 to build, sign and publish a release:
#   git tag v1.5.0 && git push origin v1.5.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.5.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          NAME="${{ github.event.inputs.version }}"
          [ -z "$NAME" ] && NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJ MIN PAT <<< "$NAME"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))   # 1.5.0 -> 10500, always increasing
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME ($CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret — see README › Releasing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build AAB and APK
        run: >
          ./gradlew --no-daemon bundleRelease assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename outputs
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab dist/WellRest-${{ steps.version.outputs.name }}.aab
          cp app/build/outputs/apk/release/app-release.apk dist/WellRest-${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping-${{ steps.version.outputs.name }}.txt

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: WellRest ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            dist/WellRest-${{ steps.version.outputs.name }}.apk
            dist/WellRest-${{ steps.version.outputs.name }}.aab

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sylvainrousseau.wellrest
          releaseFiles: dist/WellRest-${{ steps.version.outputs.name }}.aab
          mappingFile: dist/mapping-${{ steps.version.outputs.name }}.txt
          track: internal
          status: completed
